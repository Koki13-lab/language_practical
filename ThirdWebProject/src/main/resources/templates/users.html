<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" th:href="@{/css/users.css}">
	<title>ユーザーリスト</title>
</head>

<body>
	<div class="sector-box">
		<h1>〇ユーザーリスト</h1>
		<div class="operation-box">
			<div class="action-box">
				<div class="condition-row">
					<form th:action="@{/users/search}" method="get">
						<label>ユーザー検索　: </label>
						<input type="text" name="uKeyword"  th:value="${uKeyword}" placeholder="検索したい名前を入力してください">
						<button type="submit">ユーザーを絞り込んで検索</button>
					</form>
				</div>
			</div>
			<table border="1">
				<thead>
					<tr>
						<th>ID</th>
						<th>名前</th>
						<th>削除ボタン</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="user : ${userList}">
						<td th:text="${user.id}"></td>
						<td th:text="${user.name}"></td>
						<td>
							<form th:action="@{/deleteUser}" method="post">
								<input type="hidden" name="id" th:value="${user.id}">
								<button type="submit">削除</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
			<div class="action-box">
				<div class="condition-row">
					
					<form th:action="@{/addUser}" method="post">
						<label>ユーザー登録　: </label>
						<input type="text" name="name" placeholder="名前を入力してください">
						<button type="submit">ユーザーを登録</button>
					</form>
				</div>
			</div>
			<div class="condition-row">
				<span>ステータス　: </span>
				<span th:if="${dataU}" th:text="${dataU}" style="color: red;"></span>
				<span th:if="${messageU}" th:text="${messageU}" style="color: red;"></span>
			</div>
		</div>
	</div>
	<div class="sector-box">
		<h1>〇ユーザースキルリスト</h1>
		<div class="operation-box">
			<div class="action-box">
				<div class="condition-row">
					<form th:action="@{/skills/search}" method="get">
						<label>スキル検索　: </label>
						<input type="text" name="sKeyword" th:value="${sKeyword}" placeholder="検索したいスキルを入力してください。">
						<label>ソート:</label>
						<select name="sort">
							<option value="" th:selected="${sort == null}">指定なし</option>
							<option value="name" th:selected="${sort == 'name'}">名前順</option>
							<option value="skill" th:selected="${sort == 'skill'}">スキル順</option>
						</select>
						<button type="submit">ユーザーを絞り込んで検索</button>
					</form>
				</div>
			</div>
			<table border="1">
				<thead>
					<tr>
						<th>名前</th>
						<th>スキル</th>
						<th>削除ボタン</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="skill : ${skillList}">
						<td th:text="${skill.name}"></td>
						<td th:text="${skill.skill}"></td>
						<td>
							<form th:action="@{/deleteSkill}" method="post">
								<input type="hidden" name="id" th:value="${skill.id}">
								<button type="submit">削除</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
			<div class="action-box">
				<div class="condition-row">
					<form th:action="@{/addSkill}" th:object="${skills}" method="post">
						<label>スキル登録　: </label>
						<input type="text" th:field="*{userId}" placeholder="ユーザーIDを入力してください">
						<input type="text" th:field="*{skill}" placeholder="スキルを入力してください">
						<button type="submit">スキルを登録</button>
					</form>
				</div>
			</div>
			<div class="condition-row">
				<span>ステータス　: </span>
				<span th:if="${dataS}" th:text="${dataS}" style="color: red;"></span>
				<span th:if="${messageS}" th:text="${messageS}" style="color: red;"></span>
			</div>
		</div>
	</div>
</body>
