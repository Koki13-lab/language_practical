<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>TODO追加</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/todoadd.css}">
</head>

<body>
	<div class="layout">
		<header class="header">
			<div class="title">アカウント - <span th:text="${loginName}"></span></div>
		</header>
		<main class="main">
			<h1>〇TODO追加画面</h1>
			<div class="main-area">
				<div class="row">
					<form th:action="@{/todo/add}" th:object="${todo}" method="post">
						<div class="row">
							<label>題名 :</label>
							<input type="text" th:field="*{title}" placeholder="題名を入力してください">
						</div>
						<div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:red;">
						</div>
						<div class="row">
							<label>優先度 :</label>
							<select th:field="*{priority}">
								<option value="1">低</option>
								<option value="2">中</option>
								<option value="3">高</option>
							</select>
						</div>
						<div class="row">
							<label>カテゴリ :</label>
							<select th:field="*{categoryId}">
								<option value="">カテゴリを選択</option>
								<option th:each="category : ${categoryList}" th:value="${category.id}"
									th:text="${category.category}">
								</option>
							</select>
						</div>
						<div th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" style="color:red;">
						</div>
						<div class="row">
							<label>期限 :</label>
							<input type="date" th:field="*{dueDate}">
						</div>
						<div class="row">
							<label>内容 :</label>
							<textarea th:field="*{content}" maxlength="2000" rows="20" cols="100"
								placeholder="内容がある場合は入力してください。"></textarea>
						</div>
						<button class="action-button" type="submit">登録する</button>
					</form>
				</div>
			</div>
		</main>
		<footer class="footer">
			<p>Ⓒ 2026 RPC Inc.</p>
			<div class="footer-button">
				<form th:action="@{/todo/list}" method="get">
					<button type="submit">一つ前へ戻る</button>
				</form>
				<form th:action="@{/home}" method="get">
					<button type="submit">ホームへ戻る</button>
				</form>
				<form th:action="@{/logout}" method="post">
					<button type="submit">ログアウト</button>
				</form>
			</div>
		</footer>
	</div>
</body>
