<!DOCTYPE html>
<html>
<head>

  <link rel="stylesheet" href="6-flex.css"/>
</head>
<body>
  <div class="layout">
  	<header class="site-header">ヘッダー</header>
  	<aside class="sidebar">サイドメニュー</aside>
  	<main class="main" id="main">
  	  <div class="box-demo">
  	  	<article class="box">
  	  	  <h3 class="ribbon">カード1枚目</h3>

  	  	  <img src="https://placehold.jp/350x150.png" width="350">

  	  	  	<button class="btn btn--ghost">色のないボタン</button>

  	  	  </div>
  	  	</article>
  	  	<article class="box">
  	  	  <h3 class="ribbon">カード2枚目</h3>
  	  	  <p>margin / border / padding / shadow / radius / background / typography</p>

  	  	  <div class="cluster">
  	  	  	<button class="btn">色のあるボタン</button>
  	  	  	<button class="btn btn--ghost">色のないボタン</button>
  	  	  	<button class="btn disabled">無効ボタン</button>
  	  	  </div>
  	  	</article>
  	  </div>
  	 </main>
  	<footer class="site-footer">フッター</footer>
  </div>
